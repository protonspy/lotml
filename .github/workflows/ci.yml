name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97"

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        run: cargo build --manifest-path compiler/Cargo.toml --locked --all-targets
      - name: Format
        run: cargo fmt --manifest-path compiler/Cargo.toml --all --check
      - name: Lint
        run: cargo clippy --manifest-path compiler/Cargo.toml --locked --all-targets -- -D warnings
      - name: Clang
        # The LLVM target's tests build with it and read its line tables with llvm-dwarfdump; under
        # CI they fail rather than skip without them.
        run: |
          clang --version
          major=$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)
          command -v "llvm-dwarfdump-$major" || command -v llvm-dwarfdump || ls "/usr/lib/llvm-$major/bin/llvm-dwarfdump"
      - name: Test
        # The LLVM target's programs built under AddressSanitizer and UndefinedBehaviorSanitizer;
        # leaks are the counting builds' to report.
        env:
          LOTML_SANITIZE: "1"
          ASAN_OPTIONS: detect_leaks=0
        run: cargo test --manifest-path compiler/Cargo.toml --locked

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The parity floor is held to the one at the base, so the history has to be there.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        run: |
          uv --directory harness sync --locked
          cargo build --manifest-path compiler/Cargo.toml --locked --release -p lotml
      - name: Format
        run: |
          uv --directory harness run ruff format --check .
          uv --directory harness run ruff format --check ../research ../compiler/crates/lotml-py/runtime
      - name: Lint
        run: |
          uv --directory harness run ruff check .
          uv --directory harness run ruff check ../research ../compiler/crates/lotml-py/runtime
      - name: Test
        run: uv --directory harness run pytest -q
      - name: Parity floor
        # Every program of harness/results/parity/floor.json still reports the same on the Python
        # and the LLVM target, and no fewer do; one that joins only asks for an update. A program
        # the floor at the base held and this one does not needs a recorded reason.
        # The base is the pull request's target, or the commit a push moved the branch from; a new
        # branch, or a base a force-push left unreachable, has no floor to hold to.
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          clang --version
          args=(floor check)
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            args+=(--since "$BASE")
          else
            echo "no base to hold the floor to: checking the run only"
          fi
          uv --directory harness run python -m lotml_harness.experiments.parity "${args[@]}"
