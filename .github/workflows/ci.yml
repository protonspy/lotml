name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Build
        run: uv --directory harness sync --locked
      - name: Format
        run: |
          uv --directory harness run ruff format --check .
          uv --directory harness run ruff format --check ../research
      - name: Lint
        run: |
          uv --directory harness run ruff check .
          uv --directory harness run ruff check ../research
      - name: Test
        run: uv --directory harness run python scripts/test_gate.py
