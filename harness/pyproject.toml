[project]
name = "lotml-harness"
version = "0.1.0"
description = "The lotml evaluation harness: task set, executor, grammars and experiments."
requires-python = ">=3.13"
dependencies = ["lark==1.3.1"]

[dependency-groups]
train = [
    "torch==2.11.0",
    "transformers==5.19.0",
    "peft==0.21.2",
    "trl==1.0.0",
    "datasets==5.1.0",
    "accelerate==1.15.0",
]
guide = [
    "tokenizers==0.23.2",
    "huggingface_hub==1.33.0",
]
agent = [
    "deepagents==0.7.22",
    "langchain-openrouter==0.2.9",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "tiktoken==0.14.0",
    "llguidance==1.9.1",
    "ruff==0.14.0",
]
stubs = [
    "certifi==2026.7.22",
    "charset-normalizer==3.5.2",
    "idna==3.20",
    "mypy==2.4.0",
    "numpy==2.5.3",
    "packaging==26.3",
    "pandas-stubs==3.0.5.260914",
    "types-python-dateutil==2.9.0.20260807",
    "types-pyyaml==6.0.12.20260906",
    "types-requests==2.33.0.20261006",
    "types-six==1.17.0.20261008",
    "urllib3==2.8.0",
]

[tool.uv]
package = false
default-groups = ["dev", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "BLE", "PTH"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Exact quotations of reference/lotml.md, matched character for character.
"lotml_harness/experiments/variants.py" = ["E501"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
