[project]
name = "lotml-harness"
version = "0.1.0"
description = "The lotml evaluation harness: task set, executor, grammars and experiments."
requires-python = ">=3.13"
dependencies = ["lark==1.3.1"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "tiktoken==0.14.0",
    "llguidance==1.9.1",
    "ruff==0.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "BLE", "PTH"]
ignore = ["S101"]
